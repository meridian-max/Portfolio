<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 408" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">GreedUp Reference Logo Sheet</title>
  <desc id="desc">A reference-matched GreedUp logo sheet with the main lockup and rounded-square app icon.</desc>
  <rect width="568" height="408" fill="#fbf7ef"/>
  <g id="primary-lockup">
    <g id="mark" transform="translate(36 60) scale(.78)">
      <path d="M153 23H94C55 23 27 52 27 90c0 40 31 70 72 70 26 0 49-12 63-31" stroke="#1d1b26" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 113c22 34 78 47 124 14" stroke="#1d1b26" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M101 65h58c3.4 0 6 2.6 6 6v58h-26V99l-47 47H56l66-66h-21Z" fill="#9900ff"/>
    </g>
    <g id="wordmark" font-family="Jost, Montserrat, Poppins, Arial, sans-serif" font-weight="500" letter-spacing="0">
      <text x="194" y="159" fill="#1d1b26" font-size="72" textLength="204" lengthAdjust="spacingAndGlyphs">Greed</text>
      <text x="414" y="159" fill="#9900ff" font-size="72" textLength="112" lengthAdjust="spacingAndGlyphs">Up</text>
      <text x="208" y="191" fill="#78737f" font-size="12" font-weight="400" letter-spacing="6.6">FREELANCING SERVICES</text>
    </g>
  </g>
  <g id="app-icon">
    <defs>
      <filter id="reference-soft-shadow" x="-20%" y="-10%" width="140%" height="150%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#1d1b26" flood-opacity=".16"/>
      </filter>
    </defs>
    <rect x="230" y="271" width="112" height="112" rx="25" fill="#fffdfa" filter="url(#reference-soft-shadow)"/>
    <g transform="translate(246 301) scale(.48)">
      <path d="M153 23H94C55 23 27 52 27 90c0 40 31 70 72 70 26 0 49-12 63-31" stroke="#1d1b26" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 113c22 34 78 47 124 14" stroke="#1d1b26" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M101 65h58c3.4 0 6 2.6 6 6v58h-26V99l-47 47H56l66-66h-21Z" fill="#9900ff"/>
    </g>
  </g>
</svg>
